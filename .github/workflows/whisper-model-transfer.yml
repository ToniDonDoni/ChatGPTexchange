name: Whisper model transfer

on:
  push:
    branches:
      - whisper-model-transfer
  workflow_dispatch:

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download multilingual Whisper small Q5 model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            --output ggml-small-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  ggml-small-q5_1.bin" | sha256sum --check
          ls -lh ggml-small-q5_1.bin

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5_1
          path: ggml-small-q5_1.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
