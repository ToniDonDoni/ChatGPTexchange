name: Whisper model transfer

on:
  push:
    branches:
      - whisper-model-transfer
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download multilingual Whisper base and tiny Q5 models
        shell: bash
        run: |
          set -euo pipefail
          for model in base tiny; do
            curl --fail --location --retry 5 --retry-delay 2 \
              --output "ggml-${model}-q5_1.bin" \
              "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-${model}-q5_1.bin"
            sha256sum "ggml-${model}-q5_1.bin" | tee "ggml-${model}-q5_1.bin.sha256"
            ls -lh "ggml-${model}-q5_1.bin"
          done

      - name: Upload base model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-q5_1
          path: |
            ggml-base-q5_1.bin
            ggml-base-q5_1.bin.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload tiny model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-tiny-q5_1
          path: |
            ggml-tiny-q5_1.bin
            ggml-tiny-q5_1.bin.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
